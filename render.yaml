# Render Blueprint (free plan): the FastAPI backend for the site-chatbot demos.
services:
  - type: web
    name: site-chatbot-api
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DAILY_USD
        sync: false
      - key: SESSION_CAP
        sync: false
      - key: IP_CAP
        sync: false
      - key: IP_CRAWL_CAP
        sync: false
      - key: IP_UPLOAD_CAP
        sync: false
      - key: PYTHON_VERSION
        sync: false
